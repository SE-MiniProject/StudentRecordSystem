name: server

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "server/**"
      - "db/**"
      # The server serves web/ (RegisterStaticRoutes), so a renamed or deleted
      # asset path is a server-visible failure. Run this job on web changes too.
      - "web/**"
      - ".github/workflows/server.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - ".env.example"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # A real Postgres, because the login path is only meaningful against one:
    # the stores are Postgres-backed, and the demo seed must authenticate.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: srs_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: srs_ci
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/srs_ci
      SRS_TLS_CERT_FILE: /tmp/srs-ci-cert.pem
      SRS_TLS_KEY_FILE: /tmp/srs-ci-key.pem
      CURL_CA_BUNDLE: /tmp/srs-ci-cert.pem

    steps:
      - uses: actions/checkout@v4

      # libpqxx itself is fetched by CMake at the pinned 8.0.2 tag, so the
      # distro's libpqxx-dev is deliberately not installed: Ubuntu ships 7.10,
      # whose exec() has no (query, params) overload, and mixing its headers with
      # an 8.x library is what produced the "double free detected in tcache 2"
      # during static init. libpq-dev stays because libpqxx needs libpq's headers
      # and libpq.so to build and link against the real client library.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev postgresql-client

      # Migrations first, then the seed. The seed's digests are verified by
      # SeedData.* in the unit tests, and the login below proves the whole
      # chain works against a real database.
      - name: Apply migrations and seed
        run: |
          psql -v ON_ERROR_STOP=1 -f db/migrations/001_roles_users.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/002_students.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/003_subjects_teaching.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/004_timetable.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/005_timetable_conflicts.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/006_semester_indexes.sql
          psql -v ON_ERROR_STOP=1 -f db/checks/semester_indexes.sql
          psql -v ON_ERROR_STOP=1 -f db/seeds/demo_data.sql
          psql -v ON_ERROR_STOP=1 -f db/seeds/demo_records.sql
          psql -v ON_ERROR_STOP=1 -f db/checks/semester_filtering.sql

      # Applying the whole chain a second time must change no rows. Every table
      # in db/ is expected to be re-runnable, because that is what happens when
      # someone applies migrations to a database that already has them. A
      # seed insert without a matching UNIQUE key would double its rows here
      # while still exiting 0, so the counts are compared, not just the status.
      - name: Migrations and seed are idempotent
        run: |
          before=$(psql -tA -c "SELECT (SELECT count(*) FROM users)||','||(SELECT count(*) FROM students)||','||(SELECT count(*) FROM grades)||','||(SELECT count(*) FROM attendance)||','||(SELECT count(*) FROM subjects)||','||(SELECT count(*) FROM teacher_subjects)||','||(SELECT count(*) FROM timetable);")
          psql -v ON_ERROR_STOP=1 -f db/migrations/001_roles_users.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/002_students.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/003_subjects_teaching.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/004_timetable.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/005_timetable_conflicts.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/006_semester_indexes.sql
          psql -v ON_ERROR_STOP=1 -f db/checks/semester_indexes.sql
          psql -v ON_ERROR_STOP=1 -f db/seeds/demo_data.sql
          psql -v ON_ERROR_STOP=1 -f db/seeds/demo_records.sql
          psql -v ON_ERROR_STOP=1 -f db/checks/semester_filtering.sql
          after=$(psql -tA -c "SELECT (SELECT count(*) FROM users)||','||(SELECT count(*) FROM students)||','||(SELECT count(*) FROM grades)||','||(SELECT count(*) FROM attendance)||','||(SELECT count(*) FROM subjects)||','||(SELECT count(*) FROM teacher_subjects)||','||(SELECT count(*) FROM timetable);")
          echo "before=$before after=$after"
          if [ "$before" != "$after" ]; then
            echo "Re-applying migrations and seed changed row counts: $before -> $after"
            exit 1
          fi

      - name: Configure
        run: cmake -S server -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Create ephemeral TLS certificate for CI
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$SRS_TLS_KEY_FILE" -out "$SRS_TLS_CERT_FILE" \
            -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1'

      - name: Smoke test
        run: |
          if env -u SRS_TLS_CERT_FILE -u SRS_TLS_KEY_FILE PORT=8087 ./build/srs_server >/tmp/srs-no-tls.log 2>&1; then
            echo "server started without TLS credentials"
            exit 1
          fi
          PORT=8088 ./build/srs_server &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 50); do
            if curl -fsS --tlsv1.2 --tls-max 1.2 https://127.0.0.1:8088/health >/dev/null; then
              ready=true
              break
            fi
            sleep 0.2
          done
          [ "$ready" = true ] || { echo "server did not answer HTTPS /health"; exit 1; }
          if curl -fsS http://127.0.0.1:8088/health >/dev/null 2>&1; then
            echo "plaintext HTTP unexpectedly reached the TLS listener"
            exit 1
          fi

      # End-to-end against a real database. The unit tests use fake stores, so
      # they cannot catch a bad seed digest, a migration that does not apply, or
      # a SQL placeholder count that only breaks at runtime. Every assertion
      # below failed at least once locally before the code was fixed.
      - name: End-to-end API against seeded database
        run: |
          PORT=8089 ./build/srs_server >/tmp/srs-e2e-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            curl -fsS https://127.0.0.1:8089/health >/dev/null && break
            sleep 0.2
          done

          base=https://127.0.0.1:8089

          login() {
            curl -fsS -X POST "$base/api/auth/login" \
              -H 'Content-Type: application/json' \
              -d "{\"username\":\"$1\",\"password\":\"$2\"}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])'
          }

          status_of() {
            curl -s -o /dev/null -w '%{http_code}' "$@"
          }

          # --- login shape (SRS-14) ---
          response=$(curl -fsS -X POST "$base/api/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin"}')
          printf '%s' "$response" | python3 -c '
          import json, sys
          body = json.load(sys.stdin)
          assert body["user"]["username"] == "admin", body
          assert body["user"]["role"] == "admin", body
          assert body["user"]["fullName"] == "Anil Deshmukh", body
          assert body["expiresAt"], body
          '

          admin=$(login admin admin)
          teacher=$(login teacher teacher)
          student=$(login student student)
          teacher3=$(login neha.kulkarni neha123)
          teacher4=$(login rahul.verma rahul123)
          student2=$(login student2 student2)
          [ -n "$admin" ] && [ -n "$teacher" ] && [ -n "$student" ] \
            && [ -n "$teacher3" ] && [ -n "$teacher4" ] && [ -n "$student2" ] \
            || { echo "one of the seeded accounts did not log in"; exit 1; }

          # --- SRS-16 view and search, role-scoped ---
          list=$(curl -fsS "$base/api/students?limit=1" -H "Authorization: Bearer $admin")
          echo "list: $list"
          printf '%s' "$list" | python3 -c '
          import json, sys
          body = json.load(sys.stdin)
          assert body["limit"] == 1, body
          assert len(body["items"]) == 1, body
          assert body["total"] >= 25, body
          assert set(body["items"][0]) == {
              "rollNo", "fullName", "dateOfBirth", "department", "semester", "contact"}, body
          '

          found=$(curl -fsS "$base/api/students?search=Asha" -H "Authorization: Bearer $admin")
          printf '%s' "$found" | python3 -c '
          import json, sys
          body = json.load(sys.stdin)
          assert body["total"] == 1, body
          assert body["items"][0]["rollNo"] == "1ABC26CS002", body
          '

          aditi=$(curl -fsS "$base/api/students?search=Aditi" -H "Authorization: Bearer $admin")
          printf '%s' "$aditi" | python3 -c '
          import json, sys
          body = json.load(sys.stdin)
          assert body["total"] == 1, body
          assert body["items"][0]["rollNo"] == "1ABC26CS003", body
          '

          # limit above the documented maximum is a client error, not a clamp.
          over=$(status_of "$base/api/students?limit=9999" -H "Authorization: Bearer $admin")
          echo "limit=9999: $over"
          [ "$over" = "400" ] || { echo "expected 400 for limit>200, got $over"; exit 1; }

          # A student may read their own record but not another's.
          own=$(status_of "$base/api/students/1ABC26CS001" -H "Authorization: Bearer $student")
          other=$(status_of "$base/api/students/1ABC26CS002" -H "Authorization: Bearer $student")
          echo "student self=$own other=$other"
          [ "$own" = "200" ] || { echo "student should read own record, got $own"; exit 1; }
          [ "$other" = "403" ] || { echo "student must not read another record, got $other"; exit 1; }

          # --- SRS-20 create, SRS-25 update, SRS-26 delete ---
          created=$(status_of -X POST "$base/api/students" \
            -H "Authorization: Bearer $admin" -H 'Content-Type: application/json' \
            -d '{"rollNo":"1ABC26CS999","fullName":"CI Test","dateOfBirth":"2003-05-05","department":"Computer Science","semester":5,"contact":"ci@example.edu"}')
          echo "create: $created"
          [ "$created" = "201" ] || { echo "expected 201 from create, got $created"; exit 1; }

          duplicate=$(status_of -X POST "$base/api/students" \
            -H "Authorization: Bearer $admin" -H 'Content-Type: application/json' \
            -d '{"rollNo":"1ABC26CS999","fullName":"CI Test","dateOfBirth":"2003-05-05","department":"Computer Science","semester":5,"contact":"ci@example.edu"}')
          echo "duplicate: $duplicate"
          [ "$duplicate" = "409" ] || { echo "expected 409 from duplicate rollNo, got $duplicate"; exit 1; }

          teacher_create=$(status_of -X POST "$base/api/students" \
            -H "Authorization: Bearer $teacher" -H 'Content-Type: application/json' \
            -d '{"rollNo":"1ABC26CS998","fullName":"Nope","dateOfBirth":"2003-05-05","department":"Computer Science","semester":5,"contact":"n@example.edu"}')
          echo "teacher create: $teacher_create"
          [ "$teacher_create" = "403" ] || { echo "expected 403 for teacher create, got $teacher_create"; exit 1; }

          invalid=$(curl -s -X POST "$base/api/students" \
            -H "Authorization: Bearer $admin" -H 'Content-Type: application/json' \
            -d '{"rollNo":"","fullName":"","semester":99}')
          echo "invalid create: $invalid"
          printf '%s' "$invalid" | python3 -c '
          import json, sys
          body = json.load(sys.stdin)
          assert body["error"]["code"] == "validation_failed", body
          assert body["error"]["fields"], body
          '

          updated=$(status_of -X PUT "$base/api/students/1ABC26CS999" \
            -H "Authorization: Bearer $admin" -H 'Content-Type: application/json' \
            -d '{"semester":6}')
          echo "update: $updated"
          [ "$updated" = "200" ] || { echo "expected 200 from update, got $updated"; exit 1; }

          deleted=$(status_of -X DELETE "$base/api/students/1ABC26CS999" \
            -H "Authorization: Bearer $admin")
          echo "delete: $deleted"
          [ "$deleted" = "204" ] || { echo "expected 204 from delete, got $deleted"; exit 1; }

          # --- SRS-F-014 view grades, role-scoped (AC-014 / TC-014) ---
          teacher2=$(login teacher2 teacher2)
          codes() {
            curl -fsS "$base/api/grades/$1" -H "Authorization: Bearer $2" \
              | python3 -c 'import json,sys; print(",".join(sorted(i["courseCode"] for i in json.load(sys.stdin)["items"])))'
          }
          g_admin=$(codes 1ABC26CS001 "$admin")
          g_teacher=$(codes 1ABC26CS001 "$teacher")
          g_teacher2=$(codes 1ABC26CS001 "$teacher2")
          g_student=$(codes 1ABC26CS001 "$student")
          echo "grades admin=$g_admin teacher=$g_teacher teacher2=$g_teacher2 student=$g_student"
          [ "$g_admin" = "CS301,CS501,CS502,CS503" ] || { echo "admin should see every grade"; exit 1; }
          [ "$g_teacher" = "CS501,CS503" ] || { echo "teacher should see only own subjects"; exit 1; }
          [ "$g_teacher2" = "CS502" ] || { echo "teacher2 should see only own subject"; exit 1; }
          [ "$g_student" = "$g_admin" ] || { echo "student should see all own grades"; exit 1; }
          g_neha=$(codes 1ABC26EC001 "$teacher3")
          g_rahul=$(codes 1ABC26IS001 "$teacher4")
          echo "additional teacher grades: neha=$g_neha rahul=$g_rahul"
          [ "$g_neha" = "EC501,EC502" ] || { echo "Neha should see only assigned EC subjects"; exit 1; }
          [ "$g_rahul" = "IS301,IS302" ] || { echo "Rahul should see only assigned IS subjects"; exit 1; }

          g_other=$(status_of "$base/api/grades/1ABC26CS002" -H "Authorization: Bearer $student")
          echo "student reading another student's grades: $g_other"
          [ "$g_other" = "403" ] || { echo "expected 403, got $g_other"; exit 1; }

          me=$(curl -fsS "$base/api/me" -H "Authorization: Bearer $student")
          echo "me: $me"
          printf '%s' "$me" | python3 -c '
          import json, sys
          body = json.load(sys.stdin)
          assert body["rollNo"] == "1ABC26CS001", body
          '
          me2=$(curl -fsS "$base/api/me" -H "Authorization: Bearer $student2")
          printf '%s' "$me2" | python3 -c '
          import json, sys
          body = json.load(sys.stdin)
          assert body["rollNo"] == "1ABC26CS003", body
          '

          # --- SRS-F-017/F-018 attendance and percentage (AC-017, AC-018) ---
          att() {
            curl -fsS "$base/api/attendance/$1" -H "Authorization: Bearer $2"
          }
          att 1ABC26CS001 "$admin" | python3 -c '
          import json, sys
          body = json.load(sys.stdin)
          print("attendance admin:", body)
          pct = {i["courseCode"]: i["percentage"] for i in body["items"]}
          assert pct == {"CS501": 75.0, "CS502": 66.67, "CS503": 100.0}, pct
          o = body["overall"]
          assert (o["conducted"], o["present"], o["percentage"]) == (8, 6, 75.0), o
          for i in body["items"]:
              assert i["present"] <= i["conducted"], i
          '
          att 1ABC26CS001 "$teacher" | python3 -c '
          import json, sys
          body = json.load(sys.stdin)
          codes = sorted(i["courseCode"] for i in body["items"])
          assert codes == ["CS501", "CS503"], codes
          assert body["overall"]["percentage"] == 80.0, body["overall"]
          '
          att 1ABC26CS001 "$student" | python3 -c '
          import json, sys
          assert len(json.load(sys.stdin)["items"]) == 3
          '
          a_other=$(status_of "$base/api/attendance/1ABC26CS002" -H "Authorization: Bearer $student")
          echo "student reading another student's attendance: $a_other"
          [ "$a_other" = "403" ] || { echo "expected 403, got $a_other"; exit 1; }

          # --- SRS-F-020 timetable, role-scoped (AC-020 / TC-020) ---
          slots() {
            curl -fsS "$base/api/timetable$1" -H "Authorization: Bearer $2" \
              | python3 -c 'import json,sys; b=json.load(sys.stdin); print(len(b["items"]), ",".join(sorted({i["teacher"] for i in b["items"]})), ",".join(sorted({str(i["semester"]) for i in b["items"]})))'
          }
          t_admin=$(slots "" "$admin")
          t_teacher=$(slots "" "$teacher")
          t_teacher2=$(slots "" "$teacher2")
          t_student=$(slots "" "$student")
          t_neha=$(slots "" "$teacher3")
          t_rahul=$(slots "" "$teacher4")
          t_student2=$(slots "" "$student2")
          echo "timetable admin=[$t_admin] teacher=[$t_teacher] teacher2=[$t_teacher2] student=[$t_student] neha=[$t_neha] rahul=[$t_rahul] student2=[$t_student2]"
          [ "$t_admin" = "16 neha.kulkarni,rahul.verma,teacher,teacher2 3,5" ] || { echo "admin should see all 16 slots"; exit 1; }
          [ "$t_teacher" = "4 teacher 5" ] || { echo "teacher should see only own 4 slots"; exit 1; }
          [ "$t_teacher2" = "4 teacher2 3,5" ] || { echo "teacher2 should see only own 4 slots"; exit 1; }
          [ "$t_student" = "6 teacher,teacher2 5" ] || { echo "student should see own class (6 slots)"; exit 1; }
          [ "$t_neha" = "4 neha.kulkarni 5" ] || { echo "Neha should see only her 4 slots"; exit 1; }
          [ "$t_rahul" = "4 rahul.verma 3" ] || { echo "Rahul should see only his 4 slots"; exit 1; }
          [ "$t_student2" = "6 teacher,teacher2 5" ] || { echo "Aditi should see her class schedule"; exit 1; }

          t_cross=$(status_of "$base/api/timetable?teacher=teacher2" -H "Authorization: Bearer $teacher")
          t_class=$(status_of "$base/api/timetable?semester=3" -H "Authorization: Bearer $student")
          t_roll=$(status_of "$base/api/timetable/1ABC26CS002" -H "Authorization: Bearer $student")
          t_own=$(status_of "$base/api/timetable/1ABC26CS001" -H "Authorization: Bearer $student")
          echo "cross-user: teacher->teacher2=$t_cross student->sem3=$t_class student->other roll=$t_roll own roll=$t_own"
          [ "$t_cross" = "403" ] && [ "$t_class" = "403" ] && [ "$t_roll" = "403" ] && [ "$t_own" = "200" ] \
            || { echo "cross-user timetable fetch was not rejected"; exit 1; }

          # --- SRS-F-019/F-021 create slots and reject interval overlaps ---
          created_slot=$(status_of -X POST "$base/api/timetable" \
            -H "Authorization: Bearer $admin" -H 'Content-Type: application/json' \
            -d '{"dayOfWeek":5,"startTime":"15:00","endTime":"16:00","courseCode":"CS501","teacher":"teacher","department":"Computer Science","semester":5,"room":"CI-ROOM-1"}')
          echo "create timetable slot: $created_slot"
          [ "$created_slot" = "201" ] || { echo "expected 201 from timetable create, got $created_slot"; exit 1; }
          slots_before_conflicts=$(slots "" "$admin")

          teacher_overlap=$(status_of -X POST "$base/api/timetable" \
            -H "Authorization: Bearer $admin" -H 'Content-Type: application/json' \
            -d '{"dayOfWeek":5,"startTime":"15:30","endTime":"16:30","courseCode":"CS503","teacher":"teacher","department":"Computer Science","semester":5,"room":"CI-ROOM-2"}')
          room_overlap=$(status_of -X POST "$base/api/timetable" \
            -H "Authorization: Bearer $admin" -H 'Content-Type: application/json' \
            -d '{"dayOfWeek":5,"startTime":"15:30","endTime":"16:30","courseCode":"CS502","teacher":"teacher2","department":"Computer Science","semester":5,"room":"CI-ROOM-1"}')
          teacher_create=$(status_of -X POST "$base/api/timetable" \
            -H "Authorization: Bearer $teacher" -H 'Content-Type: application/json' \
            -d '{"dayOfWeek":5,"startTime":"17:00","endTime":"18:00","courseCode":"CS501","teacher":"teacher","department":"Computer Science","semester":5,"room":"CI-ROOM-3"}')
          echo "timetable teacher overlap=$teacher_overlap room overlap=$room_overlap teacher create=$teacher_create"
          [ "$teacher_overlap" = "409" ] && [ "$room_overlap" = "409" ] && [ "$teacher_create" = "403" ] \
            || { echo "timetable conflict or role enforcement failed"; exit 1; }
          after_conflicts=$(slots "" "$admin")
          [ "$after_conflicts" = "$slots_before_conflicts" ] || { echo "conflicting timetable requests changed existing slots: before=$slots_before_conflicts after=$after_conflicts"; exit 1; }

          # --- SRS-19 create account, SRS-17 patch account ---
          account=$(status_of -X POST "$base/api/accounts" \
            -H "Authorization: Bearer $admin" -H 'Content-Type: application/json' \
            -d '{"username":"ciuser","password":"ci-password","fullName":"CI User","role":"teacher"}')
          echo "create account: $account"
          [ "$account" = "201" ] || { echo "expected 201 from create account, got $account"; exit 1; }

          # The new account works, proving the password was stored hashed.
          ci_token=$(login ciuser ci-password)
          [ -n "$ci_token" ] || { echo "newly created account cannot log in"; exit 1; }

          # Deactivating it must revoke access, not just flip a column.
          patched=$(status_of -X PATCH "$base/api/accounts/ciuser" \
            -H "Authorization: Bearer $admin" -H 'Content-Type: application/json' \
            -d '{"active":false}')
          echo "patch account: $patched"
          [ "$patched" = "200" ] || { echo "expected 200 from patch, got $patched"; exit 1; }

          revoked=$(status_of "$base/api/students" -H "Authorization: Bearer $ci_token")
          echo "deactivated token: $revoked"
          [ "$revoked" = "401" ] || { echo "deactivated account still authorised, got $revoked"; exit 1; }

          # --- forged credentials (SRS-15) ---
          forged=$(status_of "$base/api/students" -H "Authorization: Bearer not-a-real-token")
          echo "forged token: $forged"
          [ "$forged" = "401" ] || { echo "expected 401 for a forged token, got $forged"; exit 1; }

          wrong=$(status_of -X POST "$base/api/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"not-the-password"}')
          echo "wrong-password status: $wrong"
          [ "$wrong" = "401" ] || { echo "expected 401 for a wrong password, got $wrong"; exit 1; }

          # --- SRS-18 logout ---
          logout=$(status_of -X POST "$base/api/auth/logout" -H "Authorization: Bearer $admin")
          echo "logout: $logout"
          [ "$logout" = "204" ] || { echo "expected 204 from logout, got $logout"; exit 1; }

          after=$(status_of "$base/api/students" -H "Authorization: Bearer $admin")
          echo "token after logout: $after"
          [ "$after" = "401" ] || { echo "logged-out token still works, got $after"; exit 1; }
          # Request credentials and bearer tokens must never appear in server logs.
          if grep -F -e 'admin' -e 'teacher' -e 'student' -e 'admin-password' \
              -e "$admin" -e "$teacher" -e "$student" -e "$teacher2" -e "$ci_token" \
              /tmp/srs-e2e-server.log; then
            echo "credential or token leaked into server logs"
            exit 1
          fi
  docker-build:
    name: Validate Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: student-record-system:ci
  publish-image:
    name: Publish Docker image
    needs: [build-and-test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/se-miniproject/studentrecordsystem:latest
            ghcr.io/se-miniproject/studentrecordsystem:sha-${{ github.sha }}
